<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memória: aproveite tudo</title>
<link rel="stylesheet" href="memoria.css">
</head>
<body>
<main>
<h1>Aproveite tudo: jogo da memória</h1>
<p class="lead">Junte cada sobra de comida com a receita ou o uso que evita o desperdício.</p>
<div class="legend"><span><i style="background:var(--sobra)"></i>Sobra</span><span><i style="background:var(--ideia)"></i>Como aproveitar</span></div>
<div class="bar">
  <span>Jogadas: <b id="moves">0</b></span>
  <span>Pares: <b id="pairs">0</b>/8</span>
  <button id="reset">Novo jogo</button>
</div>
<div class="board" id="board"></div>
<div class="msg" id="msg" aria-live="polite"></div>
<ul id="tips"></ul>
</main>

<script src="memoria.js"></script>
</body>
</html>
